name: FitCoach

options:
  bundleIdPrefix: com.sasawang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  FitCoach:
    type: application
    platform: iOS
    info:
      path: FitCoach/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.sasawang.FitCoach2026.workout
            CFBundleURLSchemes:
              - fitcoach
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: FitCoach
    resources:
      - path: FitCoach/Assets.xcassets
    dependencies:
      - target: FitCoachLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoach2026
        PRODUCT_NAME: FitCoach
        DEVELOPMENT_TEAM: 6RG2F8YY59
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true

  FitCoachLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: FitCoachLiveActivity
        excludes:
          - Info.plist
      - path: FitCoach/Support/RestActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoach2026.RestActivity
        PRODUCT_NAME: FitCoachLiveActivity
        DEVELOPMENT_TEAM: 6RG2F8YY59
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: FitCoachLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"

  FitCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitCoachTests
    resources:
      - path: FitCoachTests/Fixtures
    dependencies:
      - target: FitCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoachTests
        GENERATE_INFOPLIST_FILE: true

  FitCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitCoachUITests
    dependencies:
      - target: FitCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoachUITests
        GENERATE_INFOPLIST_FILE: true

schemes:
  FitCoach:
    build:
      targets:
        FitCoach: all
        FitCoachLiveActivity: all
        FitCoachTests: [test]
        FitCoachUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FitCoachTests
        - FitCoachUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
