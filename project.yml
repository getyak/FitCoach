name: FitCoach

options:
  bundleIdPrefix: com.sasawang
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  FitCoach:
    type: application
    platform: iOS
    sources:
      - path: FitCoach
    resources:
      - path: FitCoach/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoach2026
        PRODUCT_NAME: FitCoach
        DEVELOPMENT_TEAM: 6RG2F8YY59
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true

  FitCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitCoachTests
    resources:
      - path: FitCoachTests/Fixtures
    dependencies:
      - target: FitCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoachTests
        GENERATE_INFOPLIST_FILE: true

  FitCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitCoachUITests
    dependencies:
      - target: FitCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sasawang.FitCoachUITests
        GENERATE_INFOPLIST_FILE: true

schemes:
  FitCoach:
    build:
      targets:
        FitCoach: all
        FitCoachTests: [test]
        FitCoachUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FitCoachTests
        - FitCoachUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
